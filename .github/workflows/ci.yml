name: GPU startup diagnostics
run-name: GPU startup diagnostics ${{ inputs.qualification_id }}
on:
  workflow_dispatch:
    inputs:
      qualification_id:
        description: Diagnostic identity; never release evidence
        required: true
        type: string
permissions:
  contents: read
jobs:
  gpu-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        warmup: ["pinned-a", "pinned-b", "pinned-c", "pinned-d"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
      - name: Diagnose independent cold browser launches and real GPU pixels
        env:
          DEBUG: pw:browser
          GPU_DIAGNOSTIC_FIRST: baseline
          GPU_DIAGNOSTIC_WARMUP: "0"
          GPU_DIAGNOSTIC_PIN_ICD: "1"
        run: node scripts/gpu-startup-diagnostic.mjs > gpu-diagnostic.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-diagnostic-${{ matrix.warmup }}
          path: gpu-diagnostic.log
          if-no-files-found: error
          retention-days: 14
